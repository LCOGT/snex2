{% load django_bootstrap5 static %}
<div class="row" style="padding-top: 50px;">
  <div class="col-md-2">
    <div class="row">
      <div class="col-md-6"><b>Telescope: </b></div>
      <div class="col-md-6" id="thumb-telescope">{{ telescope }}</div>
    </div>
    <div class="row">
      <div class="col-md-6"><b>Instrument: </b></div>
      <div class="col-md-6" id="thumb-instrument">{{ instrument }}</div>
    </div>
    <div class="row">
      <div class="col-md-6"><b>Filter: </b></div>
      <div class="col-md-6" id="thumb-filter">{{ filter }}</div>
    </div>
    <div class="row">
      <div class="col-md-6"><b>Exptime: </b></div>
      <div class="col-md-6" id="thumb-exptime">{{ exptime }}</div>
    </div>
    <div class="row">
      <div class="col-md-6"><b>FWHM: </b></div>
      <div class="col-md-6" id="thumb-fwhm" title="PSF FWHM in arcsec. Lower is sharper.">{{ fwhm }}</div>
    </div>
    <div class="row">
      <div class="col-md-6"><b>WCS: </b></div>
      <div class="col-md-6" id="thumb-wcs" title="Failed means the WCS pipeline stage failed">{{ wcs }}</div>
    </div>
  </div>
  <div class="col-md-8">
    <div class="row" id="form-thumbnail">
      <button class="btn" id="previous-img" style="font-size: 20px;" onclick="prevImg()">&laquo; Previous <span class="thumb-spinner spinner-border spinner-border-sm d-none" role="status"></span></button>
      <img id="form-img" style="width: 70%; height: 70%; margin-left: 5px; margin-top: 5px;" src="{{ thumb }}" alt="img">
      <button class="btn" id="next-img" style="font-size: 20px; display: none;" onclick="nextImg()"><span class="thumb-spinner spinner-border spinner-border-sm d-none" role="status"></span> Next &raquo;</button>
    </div>
    <div class="row justify-content-center mt-3">
      <input type="hidden" id="download-filename" name="filename">
      <button type="button" class="btn btn-primary" onclick="downloadFile(event)">Download Fits</button>
    </div>
  </div>
  <div class="col-md-2">
    <form>
      {% bootstrap_form form %}
    </form>
    <div id="form-loading"><span class="thumb-spinner spinner-border spinner-border-sm d-none" role="status"></span></div>
  </div>
</div>
<script>
  var zoom = document.getElementById("id_zoom");
  zoom.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      makeThumbnail("form-loading");
    }
  });
  var sigma = document.getElementById("id_sigma");
  sigma.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      makeThumbnail("form-loading");
    }
  });
  var filename = document.getElementById("id_filenames");
  filename.addEventListener("change", function (e) {
    if (filename.selectedIndex === filename.options.length - 1) {
      document.getElementById("previous-img").style.display = "none";
      document.getElementById("next-img").style.display = "block";
    } else if (filename.selectedIndex === 0) {
      document.getElementById("previous-img").style.display = "block";
      document.getElementById("next-img").style.display = "none";
    } else {
      document.getElementById("previous-img").style.display = "block";
      document.getElementById("next-img").style.display = "block";
    }
    makeThumbnail("form-loading");
  });
  var formImg = document.getElementById("form-img");
  function setThumbLoading(loading, buttonId) {
    document.querySelectorAll(".thumb-spinner").forEach(function (spinner) { spinner.classList.toggle("d-none", !loading || spinner.parentElement.id !== buttonId); });
    document.getElementById("previous-img").disabled = loading;
    document.getElementById("next-img").disabled = loading;
  };
  formImg.addEventListener("load", function () { setThumbLoading(false); });
  formImg.addEventListener("error", function () { setThumbLoading(false); });
  function makeThumbnail(buttonId) {
    setThumbLoading(true, buttonId);
    var zoomVal = document.getElementById("id_zoom").value;
    var sigmaVal = document.getElementById("id_sigma").value;
    var filenameVal = document.getElementById("id_filenames").value;
    document.getElementById("download-filename").value = filenameVal;
    $.ajax({
      url: '{% url "make-thumbnail" %}',
      data: {'zoom': zoomVal,
             'sigma': sigmaVal,
             'filenamedict': filenameVal
      },
      dataType: 'json',
      success: function(response) {
        if (formImg.src === response.thumb) {
          setThumbLoading(false);
        } else {
          formImg.src = response.thumb;
        }
        $('#thumb-telescope').html(response.telescope);
        $('#thumb-instrument').html(response.instrument);
        $('#thumb-filter').html(response.filter);
        $('#thumb-exptime').html(response.exptime);
        $('#thumb-fwhm').html(response.fwhm);
        $('#thumb-wcs').html(response.wcs);
      },
      error: function() {
        setThumbLoading(false);
      }
    });
  };
  function prevImg() {
    var select = document.getElementById("id_filenames");
    if (select.selectedIndex >= select.options.length - 1) { return; }
    if (select.selectedIndex === select.options.length - 2) {
      select.selectedIndex++;
      document.getElementById("previous-img").style.display = "none";
      document.getElementById("next-img").style.display = "block";
    } else {
      select.selectedIndex++;
      document.getElementById("next-img").style.display = "block";
    }
    makeThumbnail("previous-img");
  };
  function nextImg() {
    var select = document.getElementById("id_filenames");
    if (select.selectedIndex <= 0) { return; }
    if (select.selectedIndex === 1) {
      select.selectedIndex--;
      document.getElementById("next-img").style.display = "none";
      document.getElementById("previous-img").style.display = "block";
    } else {
      select.selectedIndex--;
      document.getElementById("previous-img").style.display = "block";
    }
    makeThumbnail("next-img");
  };
  async function downloadFile(event) {
    event.preventDefault();
    const downloadButton = document.querySelector("button[onclick='downloadFile(event)']");
    const filenameVal = document.getElementById("id_filenames").value;
    const fileData = JSON.parse(filenameVal);
    const finalFilename = fileData.filename + '.fits';

    const originalButtonText = downloadButton.innerHTML;
    downloadButton.innerHTML = "Downloading...";
    downloadButton.disabled = true;

    const response = await fetch(`{% url 'download-fits' %}?filename=${encodeURIComponent(filenameVal)}`);
    const blob = await response.blob();

    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = url;
    a.download = finalFilename;
    document.body.appendChild(a);
    a.click();
    window.URL.revokeObjectURL(url);
    document.body.removeChild(a);

    downloadButton.innerHTML = originalButtonText;
    downloadButton.disabled = false;
  }
  document.getElementById("download-filename").value = document.getElementById("id_filenames").value;
</script>

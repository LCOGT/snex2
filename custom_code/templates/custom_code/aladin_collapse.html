<div id="aladin-lite-{{ target.name }}" style="width:200px;height:200px;" class="panel-body"></div>
<script type="text/javascript">
  window.addEventListener('load', function () {
    var script = document.getElementById('aladin-js');
    if (!script) {
      script = Object.assign(document.createElement('script'), {id: 'aladin-js', src: '//aladin.cds.unistra.fr/AladinLite/api/v3/3.8.2/aladin.js'});
      document.head.appendChild(script);
    }
    script.addEventListener('load', function () { A.init.then(function () {
      var aladin = A.aladin(document.getElementById('aladin-lite-{{ target.name }}'), {
        survey: "P/PanSTARRS/DR1/color/z/zg/g",
        fov: 0.03,
        target: "{{ target.ra }} {{ target.dec }}",
        showGotoControl: false,
        showZoomControl: false,
      });
      var hipsCats = {
        'ps1': A.catalogHiPS('https://axel.u-strasbg.fr/HiPSCatService/II/349/ps1', {name: 'PanSTARRS DR1', shape: 'circle', sourceSize: 8, color: '#6baed6', onClick: 'showTable'}),
        'gdr2': A.catalogHiPS('https://axel.u-strasbg.fr/HiPSCatService/I/345/gaia2', {name: 'Gaia DR2', shape: 'circle', sourceSize: 8, color: '#d66bae', onClick: 'showTable'})
      };
      hipsCats['ps1'].hide();
      hipsCats['gdr2'].hide();
      aladin.addCatalog(hipsCats['ps1']);
      aladin.addCatalog(hipsCats['gdr2']);
    }); });
  });
</script>
